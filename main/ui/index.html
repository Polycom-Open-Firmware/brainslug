<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>brainslug</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;margin:0;background:#0c0c10;color:#e6e6e6}
header{padding:8px 14px;background:#1a1a22;border-bottom:1px solid #333;display:flex;gap:12px;align-items:center}
header #logo{height:32px;width:auto;display:block}
header h1{font-size:16px;margin:0;font-weight:600}
#info{font-family:ui-monospace,monospace;font-size:12px;color:#8aa}
main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;height:calc(100vh - 50px)}
@media (max-width:720px){
  main{grid-template-columns:1fr;height:auto}
  section{min-height:50vh}
  header{flex-wrap:wrap}
  #info{font-size:11px}
}
section{background:#15151b;border:1px solid #2a2a35;border-radius:6px;display:flex;flex-direction:column;min-height:200px}
section h2{font-size:13px;font-weight:600;margin:0;padding:8px 12px;background:#1a1a22;border-bottom:1px solid #2a2a35}
.controls{padding:6px 10px;display:flex;gap:8px;align-items:center;font-size:12px;background:#13131a;border-bottom:1px solid #2a2a35}
.controls select,.controls button{background:#23232c;color:#e6e6e6;border:1px solid #3a3a4a;padding:3px 8px;border-radius:3px;font:inherit}
#term{width:calc(80ch + 16px);height:calc(40 * 1.2em + 16px);overflow-y:auto;overflow-x:hidden;font-family:ui-monospace,monospace;font-size:12px;line-height:1.2;padding:8px;white-space:pre-wrap;word-break:break-all;background:#000;color:#9f9;align-self:start;flex:none}
#fft{flex:1}
#fft-meta{padding:4px 10px;font-family:ui-monospace,monospace;font-size:11px;color:#8aa}
</style></head>

  <h1>brainslug</h1>
  <span id="info">loading…</span>
</header>
<main>
  <section>
    <h2>serial</h2>
    <div class="controls">
      port <select id="port"><option value="1">1</option><option value="2">2</option></select>
      <button id="connect">connect</button>
      <button id="clear">clear</button>
      <span id="ws-state">disconnected</span>
    </div>
    <div id="term"></div>
  </section>
  <section>
    <h2>camera</h2>
    <div class="controls">
      <button id="cam-snap">snapshot</button>
      <button id="cam-stream">stream</button>
      <button id="cam-stop">stop</button>
      <button id="cam-rot">↻ 90°</button>
      <button id="cam-flip">⇄ flip</button>
      <span id="cam-state">idle</span>
    </div>
    <div class="controls" style="flex-wrap:wrap;gap:6px 12px">
      <label><input type="checkbox" id="cam-aec" checked> exposure auto</label>
      <label>val <input type="range" id="cam-aec-val" min="0" max="1200" value="300" style="vertical-align:middle"><span id="cam-aec-val-n">300</span></label>
      <label><input type="checkbox" id="cam-agc" checked> gain auto</label>
      <label>val <input type="range" id="cam-agc-val" min="0" max="30"   value="0"   style="vertical-align:middle"><span id="cam-agc-val-n">0</span></label>
    </div>
    <div id="cam-wrap" style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden">
      <img id="cam" style="max-width:100%;max-height:100%;object-fit:contain;transition:transform .15s" alt="">
    </div>
  </section>
</main>
<script>
fetch('/info').then(r=>r.json()).then(j=>{info.textContent=`${j.app} ${j.version} idf=${j.idf} board=${j.board} part=${j.running_partition}`});

// Serial terminal over /uart/N/ws
let ws=null;
const term=document.getElementById('term');
function append(s){term.textContent+=s;term.scrollTop=term.scrollHeight}
document.getElementById('connect').onclick=()=>{
  const port=document.getElementById('port').value;
  if(ws){ws.close();ws=null}
  ws=new WebSocket(`ws://${location.host}/uart/${port}/ws`);
  ws.binaryType='arraybuffer';
  ws.onopen=()=>{document.getElementById('ws-state').textContent=`connected uart/${port}`};
  ws.onclose=()=>{document.getElementById('ws-state').textContent='disconnected'};
  ws.onmessage=e=>append(new TextDecoder().decode(new Uint8Array(e.data)));
};
document.getElementById('clear').onclick=()=>{term.textContent=''};
addEventListener('keydown',e=>{
  if(!ws||ws.readyState!==1)return;
  if(e.target.tagName==='SELECT'||e.target.tagName==='BUTTON')return;
  let b=null;
  if(e.key.length===1) b=new Uint8Array([e.key.charCodeAt(0)]);
  else if(e.key==='Enter') b=new Uint8Array([13]);
  else if(e.key==='Backspace') b=new Uint8Array([8]);
  else if(e.key==='Tab') b=new Uint8Array([9]);
  if(b){ws.send(b);e.preventDefault()}
});


// Camera
const cam=document.getElementById('cam'),camState=document.getElementById('cam-state');
let camRot=parseInt(localStorage.camRot||'0'), camFlip=localStorage.camFlip==='1';
function applyCamXform(){
  // When rotated 90/270, swap width/height constraints so it still fits.
  const swap=(camRot%180!==0);
  cam.style.transform=`rotate(${camRot}deg)${camFlip?' scaleX(-1)':''}`;
  cam.style.maxWidth=swap?'100vh':'100%';
  cam.style.maxHeight=swap?'100vw':'100%';
  localStorage.camRot=camRot; localStorage.camFlip=camFlip?'1':'0';
}
applyCamXform();
document.getElementById('cam-snap').onclick=()=>{cam.src='/camera/snapshot?'+Date.now();camState.textContent='snapshot'};
document.getElementById('cam-stream').onclick=()=>{cam.src='/camera/stream?'+Date.now();camState.textContent='streaming'};
document.getElementById('cam-stop').onclick=()=>{cam.src='';camState.textContent='idle'};
document.getElementById('cam-rot').onclick=()=>{camRot=(camRot+90)%360;applyCamXform()};
document.getElementById('cam-flip').onclick=()=>{camFlip=!camFlip;applyCamXform()};
addEventListener('resize',applyCamXform);

// Camera exposure / gain
function camPost(body){
  return fetch('/camera/controls',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(r=>r.json()).then(j=>{
      // Reflect into UI when initial values come back
      if(typeof j.exposure_auto==='boolean') document.getElementById('cam-aec').checked=j.exposure_auto;
      if(typeof j.exposure_value==='number'){document.getElementById('cam-aec-val').value=j.exposure_value;document.getElementById('cam-aec-val-n').textContent=j.exposure_value}
      if(typeof j.gain_auto==='boolean') document.getElementById('cam-agc').checked=j.gain_auto;
      if(typeof j.gain_value==='number'){document.getElementById('cam-agc-val').value=j.gain_value;document.getElementById('cam-agc-val-n').textContent=j.gain_value}
    });
}
const aec=document.getElementById('cam-aec'),aecV=document.getElementById('cam-aec-val'),aecN=document.getElementById('cam-aec-val-n');
const agc=document.getElementById('cam-agc'),agcV=document.getElementById('cam-agc-val'),agcN=document.getElementById('cam-agc-val-n');
aec.onchange=()=>camPost({exposure_auto:aec.checked});
agc.onchange=()=>camPost({gain_auto:agc.checked});
let aecT=null,agcT=null;
aecV.oninput=()=>{aecN.textContent=aecV.value;clearTimeout(aecT);aecT=setTimeout(()=>{aec.checked=false;camPost({exposure_auto:false,exposure_value:+aecV.value})},150)};
agcV.oninput=()=>{agcN.textContent=agcV.value;clearTimeout(agcT);agcT=setTimeout(()=>{agc.checked=false;camPost({gain_auto:false,gain_value:+agcV.value})},150)};
// initial state pull
fetch('/camera/info').then(r=>r.json()).then(j=>{
  if(typeof j.exposure_auto==='boolean') aec.checked=j.exposure_auto;
  if(typeof j.exposure_value==='number'){aecV.value=j.exposure_value;aecN.textContent=j.exposure_value}
  if(typeof j.gain_auto==='boolean') agc.checked=j.gain_auto;
  if(typeof j.gain_value==='number'){agcV.value=j.gain_value;agcN.textContent=j.gain_value}
});
</script></body></html>
